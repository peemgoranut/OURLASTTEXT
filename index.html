<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our text 💕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Prompt, sans-serif;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 1. ฉาก Intro ข้อความ & Choice กลางหน้าจอ */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #141418;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 100;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }

        .intro-text {
            color: #ffffff;
            font-size: 1.25rem;
            line-height: 1.8;
            text-align: center;
            max-width: 500px;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 1s ease;
            white-space: pre-line;
        }

        .intro-text.fade-in {
            opacity: 1;
        }

        .intro-choice-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 320px;
            margin-top: 60px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .intro-choice-group.fade-in {
            opacity: 1;
        }

        .btn-choice {
            background-color: #ffffff;
            color: #000000;
            font-size: 1.05rem;
            font-weight: 400;
            border: 1px solid #ffffff;
            padding: 14px 20px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-choice:hover {
            background-color: #e6e6e6;
            transform: translateY(-2px);
        }

        .hidden {
            opacity: 0 !important;
            visibility: hidden;
            pointer-events: none;
        }

        /* 2. กรอบหน้าจอแชท */
        .chat-wrapper {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #bababa;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: opacity 1.2s ease;
        }

        @media (min-width: 480px) {
            .chat-wrapper {
                height: 90vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }

        .chat-header {
            background: #bababa;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #757575;
            z-index: 10;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background-color: #2ed573;
            border: 2px solid #0b0b0b;
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 0;
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .chat-name {
            font-weight: bold;
            font-size: 1rem;
            color: #000000;
        }

        .chat-status {
            font-size: 0.75rem;
            color: #000000;
        }

        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        .msg.left {
            align-self: flex-start;
            background-color: #ffffff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .msg.right {
            align-self: flex-end;
            background-color: #1581e5;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            align-self: flex-start;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #aaa;
            border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-footer {
            padding: 12px 16px;
            background: #bababa;
            border-top: 1px solid #757575;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-input-group {
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            background-color: #ffffff;
            color: #333333;
            font-size: 0.95rem;
            padding: 12px 16px;
            border: 1px solid #ffffff;
            border-radius: 20px;
            outline: none;
            transition: all 0.2s ease;
        }

        .chat-input::placeholder {
            color: #888888;
        }

        .btn-send {
            background-color: #000000;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .name-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .name-title {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 3. ฉากจดหมายส่งท้าย */
        .letter-box {
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            overflow-y: auto;
            color: #e0e0e0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .letter-box.fade-in {
            opacity: 1;
        }

        .letter-paragraph {
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 18px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .letter-highlight {
            color: #ff85a2;
            font-weight: 500;
            display: inline-block;
            margin: 4px 0;
        }

        .letter-signoff {
            margin-top: 30px;
            text-align: right;
            font-size: 1rem;
            line-height: 1.6;
            color: #ffffff;
            font-weight: 500;
        }
    </style>
</head>
<body>

        let audioCtx = null;
        let sourceNode = null;

        async function playSeamlessBGM(audioUrl) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const response = await fetch(audioUrl);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                sourceNode = audioCtx.createBufferSource();
                sourceNode.buffer = audioBuffer;
                sourceNode.loop = true;

                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.4;

                sourceNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                sourceNode.start(0);
            } catch (e) {
                console.log("Web Audio API Fallback:", e);
                if (bgm) {
                    bgm.volume = 0.4;
                    bgm.load();
                    bgm.play().catch(err => console.log("Audio play failed:", err));
                }
            }
        }

        function handleStartName() {
            const inputName = partnerNameInput.value.trim();
            
            if (inputName !== "") {
                partnerName = inputName;
                chatNameElem.innerText = inputName;
            } else {
                partnerName = "เธอ";
                chatNameElem.innerText = "BABE";
            }

            const audioSrc = bgm ? bgm.getAttribute("src") : "bgm.wav";
            playSeamlessBGM(audioSrc);

            if (nameOverlay) nameOverlay.classList.add("hidden");
            if (introOverlay) introOverlay.classList.remove("hidden");

            processNextStep();
        }

        if (startBtn) startBtn.onclick = handleStartName;
        if (partnerNameInput) {
            partnerNameInput.onkeypress = (e) => {
                if (e.key === 'Enter') handleStartName();
            };
        }

        function playIntroText(text, duration, callback) {
            introTextElem.innerText = text;
            introTextElem.classList.add("fade-in");

            if (duration > 0) {
                setTimeout(() => {
                    introTextElem.classList.remove("fade-in");
                    setTimeout(() => {
                        callback();
                    }, 1000);
                }, duration);
            } else {
                callback();
            }
        }

        function showIntroChoices(options, onSelect) {
            introChoiceGroup.innerHTML = "";
            options.forEach(optionText => {
                const btn = document.createElement("button");
                btn.className = "btn-choice";
                btn.innerText = optionText;
                btn.onclick = () => {
                    onSelect();
                };
                introChoiceGroup.appendChild(btn);
            });

            setTimeout(() => {
                introChoiceGroup.classList.add("fade-in");
            }, 300);
        }

            if (isChatRevealed) return;
            isChatRevealed = true;

            introOverlay.classList.add("hidden");
            chatWrapper.classList.remove("hidden");
            scrollToBottom();
        }

            typingElem.className = "typing-indicator";
            typingElem.id = "typingIndicator";
            typingElem.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
            chatBody.appendChild(typingElem);
            scrollToBottom();

            setTimeout(() => {
                const indicator = document.getElementById("typingIndicator");
                if (indicator) indicator.remove();

                callback();
            }, delay);
        }

        function appendLeftMessage(item) {
            const messageText = typeof item.text === 'function' ? item.text() : item.text;

            if (messageText) {
                const msg = document.createElement("div");
                msg.className = "msg left";
                msg.innerText = messageText;
                chatBody.appendChild(msg);
            } else if (item.image) {
                const img = document.createElement("img");
                img.className = "msg-img";
                img.src = item.image;
                chatBody.appendChild(img);
            }
            scrollToBottom();
        }

        function appendRightMessage(text) {
            const msg = document.createElement("div");
            msg.className = "msg right";
            msg.innerText = text;
            chatBody.appendChild(msg);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function processNextStep() {
            if (scriptIndex >= chatScript.length) return;

            const currentItem = chatScript[scriptIndex];

            if (currentItem.type === "intro") {
                playIntroText(currentItem.text, currentItem.duration, () => {
                    scriptIndex++;
                    processNextStep();
                });
            } 
            else if (currentItem.type === "choice") {
                showIntroChoices(currentItem.options, () => {
                    transitionToChat();
                    scriptIndex++;
                    processNextStep();
                });
            } 
            else if (currentItem.type === "pause") {
                setTimeout(() => {
                    scriptIndex++;
                    processNextStep();
                }, currentItem.duration || 3000);
            }
            else if (currentItem.type === "resetChatWithTime") {
                chatWrapper.classList.add("hidden");
                chatBody.innerHTML = "";
                introChoiceGroup.innerHTML = "";
                introChoiceGroup.classList.remove("fade-in");
                introOverlay.classList.remove("hidden");
                
                playIntroText(currentItem.text, currentItem.duration, () => {
                    introOverlay.classList.add("hidden");
                    chatWrapper.classList.remove("hidden");
                    scriptIndex++;
                    processNextStep();
                });
            }
            else if (currentItem.type === "outro") {
                chatWrapper.classList.add("hidden");
                introChoiceGroup.innerHTML = ""; 
                introChoiceGroup.classList.remove("fade-in");
                introOverlay.classList.remove("hidden");

                playIntroText(currentItem.text, currentItem.duration, () => {
                    scriptIndex++;
                    processNextStep();
                });
            }
            else if (currentItem.type === "showLetter") {
                introOverlay.classList.remove("hidden");
                introTextElem.style.display = "none";
                introChoiceGroup.style.display = "none";

                let letterBox = document.getElementById("letterBox");
                if (!letterBox) {
                    letterBox = document.createElement("div");
                    letterBox.id = "letterBox";
                    letterBox.className = "letter-box";
                    introOverlay.appendChild(letterBox);
                }

                const letterHTML = `
                    <div class="letter-content">
                        <p class="letter-paragraph">สวัสดี ${partnerName} เองนะ</p>
                        <p class="letter-paragraph">ตอนนี้คงผ่านไปหนึ่งปีพอดีแล้วสิ หลังจากคืนนั้น<br>คงไม่ได้แอบร้องไห้ใช่ไหม<br>ถ้าร้องก็ไม่เป็นไรนะ เราเองก็คิดถึงเธอเหมือนกัน</p>
                        <p class="letter-paragraph">รู้ไหม ก่อนจะถึงวันนั้น เรามีหลายอย่างที่อยากบอกเธอมากเลย แต่ไม่รู้ว่าควรเริ่มจากตรงไหนดี<br>จนสุดท้ายเราก็นึกถึงวันแรกที่เราเจอกันขึ้นมา<br>วันที่เธอเคยบอกเราว่าตอนแรกเธอคิดว่าเรา<br><span class="letter-highlight">“${userAnswers.firstImpression || "..."}”</span><br>อ่านแล้วก็อดยิ้มไม่ได้เลย 55555<br>ใครจะไปคิดว่าคนที่เธอเคยมองแบบนั้น จะกลายมาเป็นคนที่มีเรื่องราวร่วมกันมากมายขนาดนี้</p>
                        <p class="letter-paragraph">เรามีทั้งวันที่มีความสุขมาก ๆ วันที่หัวเราะจนหยุดไม่ได้ และวันที่เราไม่เข้าใจกันจนไม่รู้จะพูดอะไรต่อ<br>บางครั้งเราก็ทำให้เธอเสียใจ บางครั้งเธอก็อาจไม่เข้าใจเรา<br>จนลืมว่าไปจริง ๆ แล้ว เราอยากกอดกันมากกว่าอยากทะเลาะกัน<br>แต่พอมองย้อนกลับไป เราก็ไม่ได้อยากลบวันเหล่านั้นออกไปทั้งหมดหรอกนะ<br>เพราะมันทำให้เราได้เรียนรู้ว่า การรักใครสักคนไม่ได้หมายความว่าเราจะเข้าใจกันได้ทุกเรื่อง<br>แต่หมายถึงการที่เรายังอยากทำความเข้าใจกัน แม้ในวันที่มันยากที่สุด</p>
                        <p class="letter-paragraph">แล้วเธอจำได้ไหม ตอนที่เราเคยถามว่า<br>“มีอะไรที่เธออยากบอกเรา แต่ไม่เคยพูดไหม?”<br>วันนั้นเธอบอกเราว่า<br><span class="letter-highlight">“${userAnswers.unsaidWords || "..."}”</span><br>ขอบคุณนะที่บอกเรา<br>เธออาจจะไม่รู้หรอกว่าคำพูดนั้นมีความหมายกับเรามากแค่ไหน<br>และถ้าวันนั้นเรายังมีโอกาสได้คุยกันอีกสักครั้ง เราก็คงอยากบอกเธอว่า<br>ดีใจที่ครั้งหนึ่งเราได้พบกันนะ<br>ขอบคุณที่เป็นทั้งความสุข เป็นทั้งบทเรียน และเป็นส่วนหนึ่งของชีวิตที่เราจะจดจำไว้เสมอ<br>ถ้าการเจอกันของเราเป็นเรื่องของโชคชะตาจริง ๆ เราก็ดีใจมากที่โชคชะตาพาเราให้มาเจอกัน<br>แต่ถ้าเราได้มีโอกาสกำหนดโชคชะตาตัวเองได้อีกครั้ง<br>เราก็ยังจะเลือกเธออยู่ดี</p>
                        <div class="letter-signoff">
                            <p>รัก</p>
                            <p>จากคนที่โชคดีที่สุดที่ได้พบเธอ</p>
                        </div>
                    </div>
                `;
                letterBox.innerHTML = letterHTML;
                setTimeout(() => {
                    letterBox.classList.add("fade-in");
                }, 300);
            }
            else if (currentItem.sender === "left") {
                chatFooter.innerHTML = "";
                const delayTime = currentItem.delay || 1200;
                
                showTypingAndSend(() => {
                    appendLeftMessage(currentItem);
                    scriptIndex++;
                    processNextStep();
                }, delayTime);
            } 
            else if (currentItem.type === "input") {
                chatFooter.innerHTML = `
                    <div class="chat-input-group">
                        <input type="text" id="userInput" class="chat-input" placeholder="${currentItem.placeholder}">
                        <button class="btn-send" id="sendBtn">ส่ง</button>
                    </div>
                `;

                const sendBtn = document.getElementById("sendBtn");
                const userInput = document.getElementById("userInput");

                const handleSend = () => {
                    const val = userInput.value.trim();
                    if (val !== "") {
                        if (currentItem.key) {
                            userAnswers[currentItem.key] = val;
                        }
                        appendRightMessage(val);
                        chatFooter.innerHTML = "";
                        scriptIndex++;
                        processNextStep();
                    }
                };

                sendBtn.onclick = handleSend;
                userInput.onkeypress = (e) => { if (e.key === 'Enter') handleSend(); };
            }
        }
    </script>
</body>
</html>
